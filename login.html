<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="google-site-verification"
      content="R22ghRm9k-QWvTi81VQbqHsugmCpbIuSsdKG9LNTSTw"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/public/logo.png?v=5" />
    <link rel="shortcut icon" href="/public/favicon.ico?v=5" />
    <link rel="apple-touch-icon" href="/public/logo.png?v=5" />
    <link rel="manifest" href="/public/manifest.json" />
    <title data-i18n="login.title">Skill Tree</title>
    <link rel="stylesheet" href="css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="js/supabase.min.js"></script>
    <base target="_blank" />
  </head>
  <body>
    <div class="login-bg">
      <div class="bg-particles"></div>
      <div class="bg-glow"></div>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="card-glow"></div>

        <div class="login-header">
          <div class="login-actions">
            <button
              type="button"
              class="icon-btn"
              data-action="toggleTheme"
              aria-label="Toggle theme"
            >
              <i class="fas fa-moon"></i>
            </button>
            <button
              type="button"
              class="icon-btn"
              data-action="toggleLang"
              aria-label="Toggle language"
            >
              <i class="fas fa-globe"></i> <span id="lang-label">EN</span>
            </button>
          </div>
          <div class="logo">
            <div class="logo-ring">
              <i class="fa-brands fa-galactic-senate"></i>
              <div class="ring-glow"></div>
            </div>
            <h1 data-i18n="app.title">Skill Tree</h1>
            <p data-i18n="login.subtitle">طور مهاراتك وتخطي حدودك</p>
          </div>
        </div>

        <div id="toast-container" role="status" aria-live="polite"></div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="login-email" data-i18n="login.email"
              >البريد الإلكتروني</label
            >
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input
                type="email"
                id="login-email"
                required
                aria-required="true"
                autocomplete="email"
                placeholder="hunter@dungeon.com"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="login-password" data-i18n="login.password"
              >كلمة المرور</label
            >
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password"
                id="login-password"
                required
                aria-required="true"
                autocomplete="current-password"
                placeholder="••••••"
              />
              <button
                type="button"
                class="toggle-password"
                data-action="togglePassword"
                aria-label="Toggle password visibility"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-glow btn-block"
            data-i18n="login.loginBtn"
          >
            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden" novalidate>
          <div class="form-group">
            <label for="register-username" data-i18n="login.username"
              >اسم المستخدم</label
            >
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input
                type="text"
                id="register-username"
                required
                minlength="3"
                maxlength="20"
                aria-required="true"
                autocomplete="username"
                placeholder="HunterName"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="register-email" data-i18n="login.email"
              >البريد الإلكتروني</label
            >
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input
                type="email"
                id="register-email"
                required
                aria-required="true"
                autocomplete="email"
                placeholder="hunter@dungeon.com"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="register-password" data-i18n="login.password"
              >كلمة المرور</label
            >
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password"
                id="register-password"
                required
                minlength="6"
                aria-required="true"
                autocomplete="new-password"
                placeholder="••••••"
              />
              <button
                type="button"
                class="toggle-password"
                data-action="togglePassword"
                aria-label="Toggle password visibility"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-glow btn-block"
            data-i18n="login.registerBtn"
          >
            <i class="fas fa-user-plus"></i> إنشاء حساب
          </button>
        </form>

        <div class="auth-switch">
          <p id="switch-text">
            <span data-i18n="login.noAccount">ليس لديك حساب؟</span>
            <button
              id="switch-btn"
              class="text-btn"
              data-action="switchAuth"
              data-i18n="login.registerLink"
            >
              سجل الآن
            </button>
          </p>
        </div>

        <div id="loading" class="loading hidden" aria-hidden="true">
          <div class="gate-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-core"></div>
          </div>
          <span data-i18n="loading">جاري فتح البوابة...</span>
        </div>
      </div>
    </div>

    <script type="module" src="js/constants.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/i18n.js"></script>
    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/utils.js"></script>
  </body>
</html>
